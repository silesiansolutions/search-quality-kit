name: Audit

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/audit.yml
  push:
    branches: [master]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
